# Automatically close stale Issues and PRs
# Runs once a day, flagging issues/PRs with no activity for a long time

name: Stale Issues & PRs

on:
  schedule:
    # Runs once a day at UTC 0:00 (08:00 Beijing time)
    - cron: '0 0 * * *'
  # Supports manual trigger
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: 🧹 Clean up stale Issues/PRs
    runs-on: ubuntu-latest

    steps:
      - name: 🏷️ Mark and close stale content
        uses: actions/stale@v10
        with:
          # ===== Issue config =====
          days-before-issue-stale: 7
          days-before-issue-close: 7
          stale-issue-label: 'stale'
          stale-issue-message: |
            👋 This issue has had no activity for **7 days**.

            If the issue still applies, please reply with an update and we'll keep following up.
            If it's resolved or no longer needed, feel free to close it.

            **If there's no reply within 7 days, this issue will be closed automatically.**
          close-issue-message: |
            🔒 This issue has been closed automatically due to prolonged inactivity.

            If the issue still applies, feel free to reopen it or open a new one.
          
          # ===== PR config =====
          days-before-pr-stale: 21
          days-before-pr-close: 14
          stale-pr-label: 'stale'
          stale-pr-message: |
            👋 This PR has had no activity for **21 days**.

            Please check whether you need to:
            - Resolve merge conflicts
            - Respond to review comments
            - Update the code

            **If there's no update within 14 days, this PR will be closed automatically.**
          close-pr-message: |
            🔒 This PR has been closed automatically due to prolonged inactivity.

            If you'd still like these changes merged, feel free to reopen it or open a new PR.
          
          # ===== Exemption rules =====
          # Items with these labels will not be marked stale
          exempt-issue-labels: 'pinned,security,enhancement,help wanted,good first issue'
          exempt-pr-labels: 'pinned,security,work-in-progress,wip'

          # Exclude draft PRs
          exempt-draft-pr: true

          # ===== Other config =====
          # Max number of items processed per run
          operations-per-run: 50

          # Only process items with these labels
          only-labels: ''

          # Remove the stale label when there's new activity
          remove-stale-when-updated: true

          # Debug mode (when true, only prints without taking action)
          debug-only: false
